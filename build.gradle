plugins {
    id 'java'
    id 'fabric-loom' version '1.7.10'
    id 'maven-publish'
}

version = project.findProperty('mod_version') ?: '26.2'
group = project.findProperty('maven_group') ?: 'com.mustard'

base {
    archivesName = project.findProperty('archives_base_name') ?: 'mustard'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
    maven { url = uri("https://maven.fabricmc.net/") }
    maven { url = uri("https://libraries.minecraft.net/") }
    maven { url = uri("https://maven.terraformersmc.com/") }
    maven { url = uri("https://maven.meteordev.org/") }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modImplementation "meteordevelopment:meteor-client:0.5.9"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}
